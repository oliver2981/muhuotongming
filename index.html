  <style>

    .panel { width: min(1040px, 100%); display: flex; flex-direction: column; align-items: center; }

    .card {

      aspect-ratio: 3 / 4; perspective: 1000px; border-radius: 14px;
    }
    .card-inner {

    /* 木幕牌阵在矮窗口（笔记本）里放不下两排，露头提示往下滑 */
    .scroll-cue {

    /* 幕间的"记忆卡"：把这一路找回来的那段话给到她 */
    .memory-veil {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;

    [data-scene="fire"] {

    .lantern-row { display: flex; gap: 28px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
    .lantern {
      border: 0; background: transparent; padding: 0; width: 170px;

      opacity: .8; transition: opacity .5s ease, transform .5s ease;

    .lantern.lit { opacity: 1; transform: translateY(-6px); }

      position: relative; width: 96px; height: 126px; border-radius: 48px 48px 40px 40px;

        radial-gradient(circle at 50% 62%, rgba(255,220,170,.55), rgba(215,107,74,.12) 58%, rgba(178,59,46,.06) 78%),

    let state = load();
    state.audioOn = false;
    let hadSave = false;
    try { hadSave = !!localStorage.getItem(KEY); } catch {}
    let started = false;
    let bgAudio = null;
    let audioCtx = null;

    function load() {
      let s;
      try { s = CORE.hydrate(localStorage.getItem(KEY)); } catch { s = CORE.createState(); }
      // hydrate 只管类型，这里再按内容白名单过一遍：手改或损坏的存档
      // 只要凑够 4 个假 pair 就会"假通关"，必须先滤掉不存在的 id。
      const pairIds = CONTENT.PAIRS.map((p) => p.id);
      s.matchedPairs = s.matchedPairs.filter((id) => pairIds.includes(id));
      if (!CONTENT.CAKES.some((c) => c.id === s.cakeChosen)) s.cakeChosen = '';
      return s;
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    }
    function setState(next) { state = next; save(); sync(); }

    function storyBanner(key) {
      const story = CONTENT.COPY.story[key];
      // 六道关合并成三幕：点数和叙事都收，路径条只剩三个落点
      const steps = { cover: 0, wood: 0, fire: 0, herbs: 1, parkour: 1, mountain: 2, cake: 2, letter: 3, finale: 3 };
      const step = steps[key] || 0;
      let path = '';
      for (let i = 0; i < 3; i++) {
        if (i === step) path += '<span class="journey-prince" aria-hidden="true"></span>';
        path += `<span class="journey-dot ${i < step ? 'done' : ''}"></span>`;
      }
      if (step >= 3) path += '<span class="journey-prince" aria-hidden="true"></span>';
      path += '<span class="journey-princess" aria-hidden="true"></span>';
      return `<div class="story-banner"><p class="story-label">${story.label}</p><p class="story-text">${story.text}</p><div class="journey" aria-hidden="true">${path}</div></div>`;
    }

    function setStoryStatus(text, root = document) {
      const el = root.querySelector('[data-testid="story-status"]');
      if (el) el.textContent = text;
    }

    // 幕间记忆卡：第一、二幕收尾各弹一次，把这一段找回来的话先给她
    const memoryVeil = $('[data-testid="memory-veil"]');
    let memoryAfter = null;

    function showMemory(key, after) {
      const mem = CONTENT.COPY.memory[key];
      if (!mem || !memoryVeil) { if (after) after(); return; }
      $('[data-testid="memory-label"]', memoryVeil).textContent = mem.label;
      $('[data-testid="memory-title"]', memoryVeil).textContent = mem.title;
      $('[data-testid="memory-lines"]', memoryVeil).innerHTML = mem.lines.map((l) => `<p>${escapeHtml(l)}</p>`).join('');
      $('[data-testid="memory-close"]', memoryVeil).textContent = mem.button;
      memoryAfter = after || null;
      memoryVeil.classList.remove('hidden');
      requestAnimationFrame(() => memoryVeil.classList.add('show'));
      chime(720);
    }

    function closeMemory() {
      if (!memoryVeil || memoryVeil.classList.contains('hidden')) return;
      memoryVeil.classList.remove('show');
      const after = memoryAfter;
      memoryAfter = null;
      setTimeout(() => {
        memoryVeil.classList.add('hidden');
        $('[data-testid="memory-lines"]', memoryVeil).innerHTML = '';
        if (after) after();
      }, 400);
    }

    if (memoryVeil) $('[data-testid="memory-close"]', memoryVeil).addEventListener('click', closeMemory);

    // 每幕收尾自动把视线带到"下一关"按钮（手机上一屏放不下，收尾按钮常在屏幕外）
    function scrollToNext(panel, delay = 320) {
      if (!panel) return;
      setTimeout(() => {
        const target = $('.done-wrap:not(.hidden)', panel)
          || $('[data-testid="cake-done"]:not(.hidden)', panel)
          || $('[data-testid="to-cake"]:not(.hidden)', panel);
        if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }, delay);
    }

    // 尾声：吹完蜡烛把视线带到双手比心那张照片（scroll-margin-top 让出顶部按钮的位置）
    function scrollToEl(el, delay = 0) {
      if (!el) return;
      setTimeout(() => el.scrollIntoView({ block: 'start', behavior: 'smooth' }), delay);
    }

    function setScene(scene) {
      started = true;
      state.scene = scene;
      save();
      sync();
      window.scrollTo(0, 0);
      updateWoodMore();
    }

    function sync() {
      const scene = started ? state.scene : 'cover';
      $$('.scene').forEach((el) => el.classList.toggle('active', el.dataset.scene === scene));
      const resume = $('[data-testid="resume"]');
      const label = CORE.resumeLabel(state);
      resume.classList.toggle('hidden', !label);
      if (label) resume.textContent = label;
      const sceneIndex = CORE.SCENES.indexOf(state.scene);
      $('[data-testid="back"]').classList.toggle('hidden', !started || sceneIndex <= 1);
      $('[data-testid="replay"]').classList.toggle('hidden', !started || state.scene === 'cover');
      if (scene === 'wood' && typeof renderWood === 'function') renderWood();
      if (scene === 'fire' && typeof renderFire === 'function') renderFire();
      if (scene === 'herbs' && typeof renderHerbs === 'function') renderHerbs();
      if (scene === 'parkour' && typeof renderParkour === 'function') renderParkour();
      if (scene === 'mountain' && typeof renderMountain === 'function') renderMountain();
      if (scene === 'cake' && typeof renderCake === 'function') renderCake();
      if (scene === 'letter' && typeof renderLetter === 'function') renderLetter();
      if (scene === 'finale' && typeof renderFinale === 'function') renderFinale();
      if (typeof renderAudio === 'function') renderAudio();
      if (scene === 'parkour' && typeof startParkour === 'function') startParkour();
    }

    function bindCover() {
      const cover = CONTENT.COPY.cover;
      $('[data-bind="title"]').textContent = cover.title;
      $('[data-bind="subtitle"]').textContent = cover.subtitle;
      $('[data-bind="date"]').textContent = cover.date;
      $('[data-bind="line"]').textContent = cover.line;
      $('[data-bind="ask"]').textContent = cover.ask;
      $('[data-bind="note"]').textContent = cover.note;
      $('[data-testid="start"]').textContent = cover.start;
      $('#cover-story').innerHTML = storyBanner('cover');
    }

    async function toggleAudio() {
      const btn = $('[data-testid="audio-toggle"]');
      if (!bgAudio) {
        try {
          bgAudio = new Audio(assets.audio);
          bgAudio.preload = 'none';
          bgAudio.loop = true;
          bgAudio.volume = 0;
        } catch {
          btn.textContent = CONTENT.COPY.audio.unavailable;
          btn.disabled = true;
          return;
        }
      }
      state.audioOn = !state.audioOn;
      btn.setAttribute('aria-pressed', String(state.audioOn));
      btn.textContent = state.audioOn ? CONTENT.COPY.audio.on : CONTENT.COPY.audio.off;
      save();
      try {
        if (state.audioOn) { await bgAudio.play(); fadeAudio(0.35); }
        else fadeAudio(0);
      } catch {
        state.audioOn = false;
        btn.setAttribute('aria-pressed', 'false');
        btn.textContent = CONTENT.COPY.audio.unavailable;
        btn.disabled = true;
        save();
      }
    }
    let fadeTimer = null;
    function fadeAudio(target) {
      if (!bgAudio) return;
      clearInterval(fadeTimer);
      fadeTimer = setInterval(() => {
        const diff = target - bgAudio.volume;
        if (Math.abs(diff) < 0.02) {
          bgAudio.volume = target;
          if (target === 0) bgAudio.pause();
          clearInterval(fadeTimer);
        } else {
          bgAudio.volume = Math.min(1, Math.max(0, bgAudio.volume + diff * 0.18));
        }
      }, 40);
    }

    function chime(freq = 520) {
      if (!state.audioOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.55);
      } catch {}
    }

    function renderAudio() {
      const btn = $('[data-testid="audio-toggle"]');
      if (btn.disabled) return;
      btn.setAttribute('aria-pressed', String(state.audioOn));
      btn.textContent = state.audioOn ? CONTENT.COPY.audio.on : CONTENT.COPY.audio.off;
    }

    function makeFireflies() {
      const wrap = $('#fireflies');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      for (let i = 0; i < 18; i++) {
        const dot = document.createElement('span');
        dot.className = 'firefly';
        dot.style.left = `${Math.random() * 100}%`;
        dot.style.top = `${20 + Math.random() * 70}%`;
        dot.style.animationDelay = `${Math.random() * 6}s`;
        dot.style.animationDuration = `${5 + Math.random() * 7}s`;
        wrap.appendChild(dot);
      }
    }

    function resetPanels() {
      // 重开/重玩时把「上一轮留下的交互状态」一并清掉，否则会出现
      // 木幕翻了一半的牌点不动、尾声蜡烛点不着这类残留问题。
      woodFirst = null;
      woodLocked = false;
      if (firePress) { clearTimeout(firePress); firePress = null; }
      if (candleTimer) { clearTimeout(candleTimer); candleTimer = null; }
      $$('.panel').forEach((p) => {
        p.dataset.ready = '';
        p.innerHTML = '';
        p.classList.remove('candle-out');
      });
    }

    function replayLevel() {
      const scene = state.scene;
      if (scene === 'cover') return;
      if (scene === 'parkour' && typeof stopParkour === 'function') stopParkour();
      const s = CORE.clone(state);
      if (scene === 'wood') s.matchedPairs = [];
      if (scene === 'fire') s.lanternsLit = [];
      if (scene === 'herbs') s.herbsFound = [];
      if (scene === 'parkour') s.parkourDone = false;
      if (scene === 'mountain') s.wish = '';
      if (scene === 'cake') { s.allergySolved = false; s.cakeChosen = ''; }
      if (scene === 'letter') s.letterRevealed = 0;
      if (scene === 'finale') s.completed = false;
      state = s;
      save();
      resetPanels();
      setScene(scene);
    }

    const woodPanel = $('#wood-panel');
    let woodFirst = null;
    let woodLocked = false;

    function woodCardHtml(kind, photo, pairId) {
      const isPhoto = kind === 'photo';
      return `
        <button class="card" data-testid="card-${kind}-${photo.id}" data-photo="${photo.id}" data-pair="${pairId}" data-kind="${kind}" aria-label="${isPhoto ? '照片卡' : '配文卡'}">
          <span class="card-inner">
            <span class="card-face card-back">${isPhoto ? '照' : '文'}</span>
            <span class="card-face ${isPhoto ? 'card-photo' : 'card-text'}">
              ${isPhoto ? `<img src="${assets.photos[photo.id]}" alt="${photo.caption}" loading="lazy">` : `<span class="caption-quote">${photo.caption}</span>`}
            </span>
          </span>
        </button>`;
    }

    function renderWood() {
      if (!woodPanel || woodPanel.dataset.ready === '1') return;
      woodPanel.dataset.ready = '1';
      const cards = CONTENT.PAIRS.flatMap((pair) => {
        const photo = photoById(pair.photoId);
        return [
          { kind: 'photo', photo, pairId: pair.id },
          { kind: 'caption', photo, pairId: pair.id }
        ];
      });
      cards.sort(() => Math.random() - 0.5);
      woodPanel.innerHTML = `
        ${storyBanner('wood')}
        <h2 class="scene-title">木 · 初遇</h2>
        <p class="scene-sub">${CONTENT.COPY.wood.intro}</p>
        <p class="story-status" data-testid="story-status"></p>
        <div class="wood-progress" data-testid="wood-progress" aria-label="木的进度">
          ${CONTENT.PAIRS.map((_, i) => `<span class="dot" data-dot="${i}"></span>`).join('')}
        </div>
        <p class="wood-message" data-testid="wood-message" aria-live="polite"></p>
        <div class="wood-grid">${cards.map((c) => woodCardHtml(c.kind, c.photo, c.pairId)).join('')}</div>
        <div class="done-wrap hidden" data-testid="wood-done">
          <div class="seal wood show">木</div>
          <p class="done-line">${CONTENT.COPY.wood.done}</p>
          <button class="btn btn-primary" data-testid="wood-next">${CONTENT.COPY.wood.next}</button>
        </div>`;
      woodPanel.onclick = onWoodClick;
      restoreWood();
      if (state.matchedPairs.length === CONTENT.PAIRS.length) setStoryStatus('记忆森林的路开了。他往夜市走去。', woodPanel);
      else if (state.matchedPairs.length > 0) setStoryStatus('他把找到的回忆收进背包，继续找下一段。', woodPanel);
      else setStoryStatus('奥利奥王子蹲在记忆森林里，先捡起一张照片。', woodPanel);
      // 牌阵比一屏高时，给一个"往下滑"的提示；她已经滑下去或又翻回上面就收起来
      setTimeout(updateWoodMore, 260);
    }

    function updateWoodMore() {
      const cue = $('[data-testid="scroll-cue"]');
      if (!cue) return;
      if (state.scene !== 'wood') { cue.classList.add('hidden'); return; }
      const cards = $$('.card', woodPanel);
      if (!cards.length) { cue.classList.add('hidden'); return; }
      // 牌阵没整块露出来就提示：整张还在屏下的数出来，只露半排的就给一句通用的
      const rects = cards.map((c) => c.getBoundingClientRect());
      const belowCount = rects.filter((r) => r.top > window.innerHeight - 8).length;
      const cut = rects.some((r) => r.bottom > window.innerHeight - 8);
      if (!cut) { cue.classList.add('hidden'); return; }
      cue.textContent = belowCount ? `↓ 下面还有 ${belowCount} 张牌，往下滑` : '↓ 下面还有牌，往下滑';
      cue.classList.remove('hidden');
    }

    function restoreWood() {
      if (!woodPanel) return;
      $$('.card', woodPanel).forEach((card) => {
        if (state.matchedPairs.includes(card.dataset.pair)) card.classList.add('matched', 'flipped');
      });
      checkWoodDone();
    }

    function onWoodClick(e) {
      const card = e.target.closest('.card');
      if (!card || woodLocked || card.classList.contains('matched')) return;
      if (!woodFirst) {
        woodFirst = card;
        card.classList.add('flipped');
        setWoodMessage(card.dataset.kind === 'photo' ? CONTENT.COPY.wood.needCaption : CONTENT.COPY.wood.needPhoto);
        chime(460);
        return;
      }
      if (woodFirst === card) return;
      if (woodFirst.dataset.kind === card.dataset.kind) {
        setWoodMessage(card.dataset.kind === 'photo' ? CONTENT.COPY.wood.needCaption : CONTENT.COPY.wood.needPhoto);
        chime(320);
        return;
      }
      card.classList.add('flipped');
      const first = woodFirst;
      woodFirst = null;
      if (first.dataset.pair === card.dataset.pair) {
        first.classList.add('matched');
        card.classList.add('matched');
        setState(CORE.recordMatch(state, card.dataset.pair, CONTENT.PAIRS.map((p) => p.id)));
        setWoodMessage('配上了。');
        chime(700);
        checkWoodDone();
        if (state.matchedPairs.length === CONTENT.PAIRS.length) scrollToNext(woodPanel);
        if (state.matchedPairs.length === CONTENT.PAIRS.length) setStoryStatus('记忆森林的路开了。他往夜市走去。', woodPanel);
        else setStoryStatus('又一段回忆对上了。他把照片收进背包。', woodPanel);
        return;
      }
      woodLocked = true;
      setWoodMessage(CONTENT.COPY.wood.mismatch);
      setTimeout(() => {
        first.classList.remove('flipped');
        card.classList.remove('flipped');
        woodLocked = false;
      }, 750);
      chime(300);
    }

    function setWoodMessage(text) {
      const msg = $('[data-testid="wood-message"]', woodPanel);
      if (msg) msg.textContent = text;
    }

    function checkWoodDone() {
      $$('[data-dot]', woodPanel).forEach((dot, i) => dot.classList.toggle('lit', i < state.matchedPairs.length));
      const done = $('[data-testid="wood-done"]', woodPanel);
      if (!done) return;
      const complete = state.matchedPairs.length === CONTENT.PAIRS.length;
      done.classList.toggle('hidden', !complete);
      if (complete && !done.dataset.bound) {
        done.dataset.bound = '1';
        $('[data-testid="wood-next"]', done).addEventListener('click', () => setScene('fire'));
      }
    }

    const firePanel = $('#fire-panel');
    let firePress = null;

    function renderFire() {
      if (!firePanel || firePanel.dataset.ready === '1') return;
      firePanel.dataset.ready = '1';
      firePanel.innerHTML = `
        ${storyBanner('fire')}
        <h2 class="scene-title fire-title">火 · 此刻</h2>
        <p class="scene-sub fire-sub">${CONTENT.COPY.fire.intro}</p>
        <p class="story-status" data-testid="story-status"></p>
        <div class="lantern-row">
          ${CONTENT.LANTERNS.map((l, i) => `
            <button class="lantern" data-testid="lantern-${i}" data-lantern="${i}" aria-label="点亮第 ${i + 1} 盏心灯">
              <span class="lantern-body"><span class="flame"></span></span>
              <span class="lantern-photo"><img src="${assets.photos[l.photoId]}" alt="${l.line}"><span>${l.line}</span></span>
            </button>`).join('')}
        </div>
        <p class="lantern-hint">${CONTENT.COPY.fire.press}</p>
        <div class="done-wrap hidden" data-testid="fire-done">
          <div class="seal fire show">火</div>
          <p class="done-line">${CONTENT.COPY.fire.done}</p>
          <p class="pause-hint">${CONTENT.COPY.pause.act1}</p>
          <button class="btn btn-fire" data-testid="fire-next">${CONTENT.COPY.fire.next}</button>
        </div>`;
      bindLanterns();
      restoreFire();
      if (state.lanternsLit.length === CONTENT.LANTERNS.length) setStoryStatus('整条夜市都亮了。他看见了远处的山。', firePanel);
      else if (state.lanternsLit.length > 0) setStoryStatus(`第 ${state.lanternsLit.length} 盏灯亮了。`, firePanel);
      else setStoryStatus('他提着灯走进夜市，一盏一盏点亮。', firePanel);
    }

    function bindLanterns() {
      $$('.lantern', firePanel).forEach((el) => {
        const index = Number(el.dataset.lantern);
        const start = () => beginPress(el, index);
        const end = () => endPress(el);
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
        el.addEventListener('pointerup', end);
        el.addEventListener('pointerleave', end);
        el.addEventListener('pointercancel', end);
        el.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
        });
        el.addEventListener('keyup', (e) => {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); end(); }
        });
      });
    }

    function beginPress(el, index) {
      if (el.classList.contains('lit') || firePress) return;
      el.classList.add('heating');
      firePress = setTimeout(() => {
        el.classList.remove('heating');
        el.classList.add('lit');
        firePress = null;
        setState(CORE.recordLantern(state, index, CONTENT.LANTERNS.length));
        chime(620 + index * 80);
        checkFireDone();
        if (state.lanternsLit.length === CONTENT.LANTERNS.length) { setStoryStatus('整条夜市都亮了。他看见了远处的山。', firePanel); scrollToNext(firePanel); }
        else setStoryStatus(`第 ${state.lanternsLit.length} 盏灯亮了。`, firePanel);
      }, 800);
    }

    function endPress(el) {
      if (firePress) { clearTimeout(firePress); firePress = null; }
      el.classList.remove('heating');
    }

    function restoreFire() {
      state.lanternsLit.forEach((i) => {
        const el = $(`[data-lantern="${i}"]`, firePanel);
        if (el) el.classList.add('lit');
      });
      checkFireDone();
    }

    function checkFireDone() {
      const done = $('[data-testid="fire-done"]', firePanel);
      if (!done) return;
      const complete = state.lanternsLit.length === CONTENT.LANTERNS.length;
      done.classList.toggle('hidden', !complete);
      if (complete && !done.dataset.bound) {
        done.dataset.bound = '1';
        $('[data-testid="fire-next"]', done).addEventListener('click', () => showMemory('act1', () => setScene('herbs')));
      }
    }

    const herbsPanel = $('#herbs-panel');
    const ELEMENTS = ['水', '木', '火', '土', '金'];

    function renderHerbs() {
      if (!herbsPanel || herbsPanel.dataset.ready === '1') return;
      herbsPanel.dataset.ready = '1';
      herbsPanel.innerHTML = `
        <div class="herb-bg" style="background-image:linear-gradient(rgba(244,236,221,.93),rgba(244,236,221,.97)),url('${assets.photos.p04}')"></div>
        <div class="herb-content">
          ${storyBanner('herbs')}
          <h2 class="scene-title">药圃 · 木火方</h2>
          <p class="scene-sub">${CONTENT.COPY.herbs.intro}</p>
          <p class="missing-line" data-testid="missing-line">还缺：木 · 火 · 心</p>
          <p class="story-status" data-testid="story-status"></p>
          <div class="herb-layout">
            <div class="element-ring" aria-label="五行相生圆环">
              ${ELEMENTS.map((el, i) => `<span class="element-node ${el === '木' || el === '火' ? 'missing' : 'present'}" data-element="${el}" style="--i:${i}">${el}</span>`).join('')}
              <span class="heart-node missing" data-testid="heart-node">心</span>
            </div>
            <div class="herb-list">
              ${CONTENT.HERBS.map((h) => `
                <button class="herb" data-testid="herb-${h.id}" data-herb="${h.id}">
                  <span class="herb-name">${h.label}</span>
                  <span class="herb-element"></span>
                </button>`).join('')}
              <p class="herb-note" data-testid="herb-note" aria-live="polite"></p>
            </div>
          </div>
          <div class="done-wrap hidden" data-testid="herbs-done">
            <div class="prescription" data-testid="prescription">
              <p class="prescription-title">${CONTENT.COPY.herbs.recipeTitle}</p>
              <p class="prescription-herbs">${CONTENT.COPY.herbs.recipeHerbs}</p>
              <p class="prescription-line">${CONTENT.COPY.herbs.recipeLine}</p>
            </div>
            <p class="done-line">${CONTENT.COPY.herbs.done}</p>
            <button class="btn btn-primary" data-testid="herbs-next">${CONTENT.COPY.herbs.next}</button>
          </div>
        </div>`;
      herbsPanel.onclick = onHerbClick;
      restoreHerbs();
      if (state.herbsFound.length === 3) setStoryStatus('方子齐了。他把药包好，往云端走。', herbsPanel);
      else if (state.herbsFound.length > 0) setStoryStatus('药篓里已经有几味了。他继续辨认。', herbsPanel);
      else setStoryStatus('他把药篓放在脚边，开始替她辨认。', herbsPanel);
    }

    function onHerbClick(e) {
      const btn = e.target.closest('.herb');
      if (!btn) return;
      const herb = CONTENT.HERBS.find((h) => h.id === btn.dataset.herb);
      $('[data-testid="herb-note"]', herbsPanel).textContent = herb.note;
      if (herb.correct && state.herbsFound.includes(herb.id)) {
        // 已经放进药篓的药材，再点一次只说"已经"了
        btn.classList.add('found');
        chime(360);
        return;
      }
      if (herb.correct) {
        const correctIds = CONTENT.HERBS.filter((h) => h.correct).map((h) => h.id);
        setState(CORE.recordHerb(state, herb.id, correctIds));
        btn.classList.add('found');
        chime(660);
        restoreHerbs();
        if (state.herbsFound.length === 3) { setStoryStatus('方子齐了。他把药包好，往云端走。', herbsPanel); scrollToNext(herbsPanel); }
        else setStoryStatus(`药篓里多了${herb.label}。`, herbsPanel);
      } else {
        chime(320);
      }
    }

    function restoreHerbs() {
      const correctByElement = { 木: 'qinghao', 火: 'jianghuang' };
      $$('.element-node', herbsPanel).forEach((node) => {
        const el = node.dataset.element;
        const herbId = correctByElement[el];
        const found = !!(herbId && state.herbsFound.includes(herbId));
        node.classList.toggle('filled', found);
        if (el === '木' || el === '火') {
          node.classList.toggle('missing', !found);
          node.classList.remove('present');
        } else {
          node.classList.add('present');
          node.classList.remove('missing');
        }
      });
      state.herbsFound.forEach((id) => {
        const btn = $(`[data-herb="${id}"]`, herbsPanel);
        if (!btn) return;
        btn.classList.add('found');
        // 药材属什么，采到之后才揭晓——找的时候只能靠名字和"还缺什么"
        const tag = $('.herb-element', btn);
        const herb = CONTENT.HERBS.find((h) => h.id === id);
        if (tag && herb && herb.element) tag.textContent = herb.element;
      });
      const heartFound = state.herbsFound.includes('hehuan');
      const heart = $('[data-testid="heart-node"]', herbsPanel);
      if (heart) {
        heart.classList.toggle('filled', heartFound);
        heart.classList.toggle('missing', !heartFound);
      }
      const missing = [];
      if (!state.herbsFound.includes('qinghao')) missing.push('木');
      if (!state.herbsFound.includes('jianghuang')) missing.push('火');
      if (!state.herbsFound.includes('hehuan')) missing.push('心');
      const missingLine = $('[data-testid="missing-line"]', herbsPanel);
      if (missingLine) missingLine.textContent = missing.length ? `还缺：${missing.join(' · ')}` : '药方齐了。';
      const done = $('[data-testid="herbs-done"]', herbsPanel);
      const complete = state.herbsFound.length === 3;
      const ringComplete = state.herbsFound.includes('qinghao') && state.herbsFound.includes('jianghuang');
      $('.element-ring', herbsPanel).classList.toggle('complete', ringComplete);
      done.classList.toggle('hidden', !complete);
      if (complete && !done.dataset.bound) {
        done.dataset.bound = '1';
        $('[data-testid="herbs-next"]', done).addEventListener('click', () => setScene('parkour'));
      }
    }

    const parkourPanel = $('#parkour-panel');
    const parkour = {
      canvas: null, ctx: null, raf: null, running: false, last: 0,
      princeX: 150, princeY: 206, vy: 0, w: 44, h: 44, groundY: 250,
      speed: 4.1, distance: 0, target: 3800, obstacles: [], spawnAt: 700,
      coyote: 0, jumpBuffer: 0, jumpHeld: false, squash: 0,
      stars: [], starsGot: 0, starSpawnAt: 900, starsSpawned: 0,
      rescuing: false, rescueFrames: 0, invincible: 0, done: false
    };

    function renderParkour() {
      if (!parkourPanel || parkourPanel.dataset.ready === '1') return;
      parkourPanel.dataset.ready = '1';
      parkourPanel.innerHTML = `
        ${storyBanner('parkour')}
        <h2 class="scene-title">${CONTENT.COPY.parkour.title}</h2>
        <p class="scene-sub">${CONTENT.COPY.parkour.hint}</p>
        <p class="story-status" data-testid="story-status"></p>
        <div class="parkour-wrap">
          <canvas class="parkour-canvas" data-testid="parkour-canvas" width="900" height="320" tabindex="0"></canvas>
          <div class="parkour-rescue hidden" data-testid="parkour-rescue">${CONTENT.COPY.parkour.rescue}</div>
        </div>
        <p class="parkour-score" data-testid="parkour-score">路程 0 / 100 · 星光 0 / 3</p>
        <div class="done-wrap hidden" data-testid="parkour-done">
          <div class="seal fire show">云</div>
          <p class="done-line">${CONTENT.COPY.parkour.done}</p>
          <p class="pause-hint">${CONTENT.COPY.pause.act2}</p>
          <button class="btn btn-primary" data-testid="parkour-next">${CONTENT.COPY.parkour.next}</button>
        </div>`;
      const canvas = $('[data-testid="parkour-canvas"]', parkourPanel);
      parkour.canvas = canvas;
      parkour.ctx = canvas.getContext('2d');
      canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); parkourJump(); });
      canvas.addEventListener('pointerup', parkourRelease);
      canvas.addEventListener('pointercancel', parkourRelease);
      canvas.addEventListener('pointerleave', parkourRelease);
      parkour.done = state.parkourDone;
      resetParkour();
      if (state.parkourDone) finishParkour(false);
      else setStoryStatus('他抱着蛋糕，跑上云端长廊。', parkourPanel);
    }

    function resetParkour() {
      parkour.last = 0;
      parkour.princeY = parkour.groundY - parkour.h;
      parkour.vy = 0;
      parkour.distance = 0;
      parkour.obstacles = [];
      parkour.spawnAt = 700;
      parkour.rescuing = false;
      parkour.rescueFrames = 0;
      parkour.invincible = 0;
      parkour.done = false;
      parkour.coyote = 0;
      parkour.jumpBuffer = 0;
      parkour.jumpHeld = false;
      parkour.squash = 0;
      parkour.stars = [];
      parkour.starsGot = 0;
      parkour.starSpawnAt = 900;
      parkour.starsSpawned = 0;
      hideRescue();
      drawParkour();
      updateParkourScore();
    }

    function startParkour() {
      if (!parkour.canvas || state.parkourDone) return;
      if (parkour.running) return;
      parkour.running = true;
      parkour.raf = requestAnimationFrame(parkourLoop);
    }

    function stopParkour() {
      parkour.running = false;
      if (parkour.raf) { cancelAnimationFrame(parkour.raf); parkour.raf = null; }
    }

    function parkourLoop(now) {
      if (!parkour.running) return;
      if (!started || state.scene !== 'parkour') { parkour.running = false; return; }
      // 按真实时间步进：一帧 = 1，60Hz 基准。30/120Hz 屏幕下路程和手感一致。
      const dt = parkour.last ? Math.min(2, Math.max(0.25, (now - parkour.last) / 16.6667)) : 1;
      parkour.last = now;
      updateParkour(dt);
      drawParkour();
      parkour.raf = requestAnimationFrame(parkourLoop);
    }

    function onParkourGround() {
      return parkour.princeY >= parkour.groundY - parkour.h - 0.5;
    }

    function doParkourJump() {
      parkour.vy = -12.5;
      parkour.coyote = 0;
      parkour.jumpBuffer = 0;
      parkour.squash = -0.2;
      chime(600);
    }

    function updateParkour(dt = 1) {
      if (parkour.done) return;
      if (parkour.rescuing) {
        parkour.rescueFrames -= dt;
        if (parkour.rescueFrames <= 0) {
          parkour.rescuing = false;
          parkour.princeY = parkour.groundY - parkour.h;
          parkour.vy = 0;
          parkour.invincible = 90;
          parkour.obstacles = parkour.obstacles.filter((o) => o.x > 360);
          hideRescue();
        }
        return;
      }
      parkour.distance += parkour.speed * dt;
      if (parkour.distance >= parkour.target) { finishParkour(true); return; }
      if (parkour.invincible > 0) parkour.invincible -= dt;
      parkour.coyote = onParkourGround() ? 6 : Math.max(0, parkour.coyote - dt);
      if (parkour.jumpBuffer > 0) {
        parkour.jumpBuffer -= dt;
        if (onParkourGround() || parkour.coyote > 0) doParkourJump();
      }
      if (!parkour.jumpHeld && parkour.vy < -3) parkour.vy += 0.9 * dt;
      parkour.princeY += parkour.vy * dt;
      parkour.vy += 0.6 * dt;
      if (parkour.princeY >= parkour.groundY - parkour.h) {
        parkour.princeY = parkour.groundY - parkour.h;
        if (parkour.vy > 3) parkour.squash = 0.22;
        parkour.vy = 0;
      }
      parkour.squash *= Math.pow(0.86, dt);
      if (parkour.distance >= parkour.spawnAt) {
        parkour.spawnAt += 330 + Math.random() * 120;
        const types = [
          { type: 'pin', w: 52, h: 26 },
          { type: 'milk', w: 56, h: 14 },
          { type: 'cake', w: 46, h: 30 }
        ];
        const t = types[Math.floor(Math.random() * types.length)];
        parkour.obstacles.push({ ...t, x: 940 });
      }
      if (parkour.starsSpawned < 3 && parkour.distance >= parkour.starSpawnAt) {
        parkour.starsSpawned += 1;
        parkour.starSpawnAt += 900;
        parkour.stars.push({ x: 940, y: 150 + Math.random() * 55, got: false });
      }
      for (const o of parkour.obstacles) o.x -= parkour.speed * dt;
      for (const s of parkour.stars) s.x -= parkour.speed * dt;
      parkour.obstacles = parkour.obstacles.filter((o) => o.x > -120);
      const px1 = parkour.princeX, px2 = px1 + parkour.w;
      const py2 = parkour.princeY + parkour.h;
      if (parkour.invincible <= 0) {
        for (const o of parkour.obstacles) {
          const ox1 = o.x, ox2 = o.x + o.w;
          const oy = parkour.groundY - o.h;
          if (px2 > ox1 && px1 < ox2 && py2 > oy + 6) {
            triggerRescue();
            break;
          }
        }
      }
      const cx = parkour.princeX + parkour.w / 2;
      const cy = parkour.princeY + parkour.h / 2;
      for (const s of parkour.stars) {
        if (!s.got && Math.abs(s.x - cx) < 26 && Math.abs(s.y - cy) < 30) {
          s.got = true;
          parkour.starsGot += 1;
          setStoryStatus('他接住了一颗星光。', parkourPanel);
          chime(880);
        }
      }
      parkour.stars = parkour.stars.filter((s) => !s.got && s.x > -50);
      updateParkourScore();
    }

    function parkourJump() {
      if (!parkour.running || parkour.done || parkour.rescuing) return;
      parkour.jumpHeld = true;
      if (onParkourGround() || parkour.coyote > 0) doParkourJump();
      else parkour.jumpBuffer = 8;
    }

    function parkourRelease() {
      parkour.jumpHeld = false;
    }

    function triggerRescue() {
      if (parkour.rescuing || parkour.done) return;
      parkour.rescuing = true;
      parkour.rescueFrames = 90;
      parkour.vy = 0;
      const el = $('[data-testid="parkour-rescue"]', parkourPanel);
      if (el) el.classList.remove('hidden');
      setStoryStatus('大米公主把他捞了回来。他拍拍身上的云，继续跑。', parkourPanel);
      chime(520);
    }

    function hideRescue() {
      const el = $('[data-testid="parkour-rescue"]', parkourPanel);
      if (el) el.classList.add('hidden');
    }

    function updateParkourScore() {
      const el = $('[data-testid="parkour-score"]', parkourPanel);
      if (!el) return;
      const pct = Math.min(100, Math.floor((parkour.distance / parkour.target) * 100));
      el.textContent = `路程 ${pct} / 100 · 星光 ${parkour.starsGot} / 3`;
    }

    function finishParkour(mark) {
      parkour.done = true;
      parkour.running = false;
      parkour.rescuing = false;
      parkour.rescueFrames = 0;
      if (parkour.raf) { cancelAnimationFrame(parkour.raf); parkour.raf = null; }
      hideRescue();
      drawParkour();
      if (mark) setState(CORE.recordParkour(state));
      const done = $('[data-testid="parkour-done"]', parkourPanel);
      if (done) {
        done.classList.remove('hidden');
        const next = $('[data-testid="parkour-next"]', done);
        if (next && !next.dataset.bound) {
          next.dataset.bound = '1';
          next.addEventListener('click', () => showMemory('act2', () => setScene('mountain')));
        }
        scrollToNext(parkourPanel, 0);      }
      const score = $('[data-testid="parkour-score"]', parkourPanel);
      if (score) score.textContent = `路程 100 / 100 · 星光 ${parkour.starsGot} / 3`;
      const doneLine = $('.done-line', parkourPanel);
      if (doneLine) {
        doneLine.textContent = parkour.starsGot >= 3
          ? '云端尽头到了。三颗星光他都接住了，这一路的云一起亮了。'
          : parkour.starsGot > 0
            ? `云端尽头到了。他带着 ${parkour.starsGot} 颗星光，看见她在灯下等他。`
            : CONTENT.COPY.parkour.done;
      }
      setStoryStatus('他到了云端尽头，看见她在灯下等他。', parkourPanel);
      chime(700);
    }

    function drawParkour() {
      const ctx = parkour.ctx;
      if (!ctx) return;
      const W = 900, H = 320, ground = parkour.groundY;
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#1B2340');
      sky.addColorStop(0.55, '#4B3A5A');
      sky.addColorStop(1, '#E8B98A');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,248,220,.7)';
      for (let i = 0; i < 40; i++) {
        const x = (i * 137 + 43) % W;
        const y = (i * 73 + 21) % 170;
        ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI * 2); ctx.fill();
      }
      const shift = parkour.distance * 0.35;
      ctx.fillStyle = 'rgba(255,248,236,.24)';
      for (let i = 0; i < 5; i++) {
        const x = ((i * 240 - shift) % (W + 240) + W + 240) % (W + 240) - 120;
        const y = 60 + (i % 3) * 38;
        ctx.beginPath();
        ctx.ellipse(x, y, 58, 20, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 40, y - 10, 38, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(x - 38, y - 6, 32, 14, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(120,80,58,.45)';
      for (let i = 0; i < 4; i++) {
        const x = ((i * 300 - shift * 0.6) % (W + 300) + W + 300) % (W + 300) - 150;
        ctx.beginPath(); ctx.arc(x, ground + 30, 120, Math.PI, 0); ctx.fill();
      }
      ctx.fillStyle = '#F3D9B8';
      ctx.beginPath();
      ctx.moveTo(0, ground);
      for (let x = 0; x <= W; x += 30) {
        ctx.quadraticCurveTo(x + 15, ground - 10, x + 30, ground);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(178,59,46,.18)';
      ctx.fillRect(0, ground + 18, W, 4);
      for (const o of parkour.obstacles) drawObstacle(ctx, o, ground);
      for (const s of parkour.stars) drawStar(ctx, s.x, s.y, 12);
      drawPrincess(ctx, 450, 46);
      if (parkour.rescuing) {
        ctx.strokeStyle = 'rgba(255,170,170,.85)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(450, 80);
        ctx.quadraticCurveTo(300, 160, parkour.princeX + 22, parkour.princeY - 20);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,220,220,.25)';
        ctx.beginPath(); ctx.arc(parkour.princeX + 22, parkour.princeY - 20, 40, 0, Math.PI * 2); ctx.fill();
      }
      const air = Math.max(0, (ground - parkour.h) - parkour.princeY);
      const shadowW = Math.max(12, 26 - air / 10);
      ctx.fillStyle = `rgba(42,42,36,${Math.max(.08, .24 - air / 600)})`;
      ctx.beginPath(); ctx.ellipse(parkour.princeX + parkour.w / 2, ground - 2, shadowW, 6, 0, 0, Math.PI * 2); ctx.fill();
      drawPrince(ctx, parkour.princeX, parkour.rescuing ? parkour.princeY - 50 : parkour.princeY, parkour.w, parkour.h);
    }

    function drawStar(ctx, x, y, r) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 ? r * 0.45 : r;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.shadowColor = 'rgba(255,233,168,.75)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#FFE9A8';
      ctx.fill();
      ctx.restore();
    }

    function drawObstacle(ctx, o, ground) {
      const y = ground - o.h;
      if (o.type === 'milk') {
        ctx.fillStyle = 'rgba(255,250,240,.9)';
        ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, ground - 4, o.w / 2, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(42,42,36,.2)';
        ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, ground - 2, o.w / 2 - 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      } else if (o.type === 'cake') {
        ctx.fillStyle = '#F3D9B8'; ctx.fillRect(o.x, y + 10, o.w, o.h - 10);
        ctx.fillStyle = '#E86A6A'; ctx.fillRect(o.x + 4, y, o.w - 8, 12);
        ctx.fillStyle = '#FFF9EC'; ctx.fillRect(o.x + 8, y - 4, o.w - 16, 6);
      } else {
        ctx.fillStyle = '#C98E5A'; ctx.fillRect(o.x + 8, y + 6, o.w - 16, o.h - 6);
        ctx.fillStyle = '#A96F42'; ctx.fillRect(o.x, y + 9, 10, 10); ctx.fillRect(o.x + o.w - 10, y + 9, 10, 10);
      }
    }

    function drawPrince(ctx, x, y, w, h) {
      const cx = x + w / 2, cy = y + h / 2;
      const sq = parkour.squash;
      const sx = 1 + sq * 0.6;
      const sy = 1 - sq * 0.6;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(sx, sy);
      ctx.translate(-cx, -cy);
      ctx.strokeStyle = '#3A2B24'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      const t = performance.now() / 120;
      ctx.beginPath(); ctx.moveTo(cx - 8, cy + 16); ctx.lineTo(cx - 12 + Math.sin(t) * 4, cy + 28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 8, cy + 16); ctx.lineTo(cx + 12 - Math.sin(t) * 4, cy + 28); ctx.stroke();
      ctx.fillStyle = '#2E211C'; ctx.beginPath(); ctx.arc(cx, cy, 21, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F6E7C8'; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#E8C64A';
      ctx.beginPath();
      ctx.moveTo(cx - 11, cy - 17); ctx.lineTo(cx - 6, cy - 28); ctx.lineTo(cx, cy - 18);
      ctx.lineTo(cx + 6, cy - 28); ctx.lineTo(cx + 11, cy - 17); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2E211C';
      ctx.beginPath(); ctx.arc(cx - 4, cy - 2, 1.5, 0, Math.PI * 2); ctx.arc(cx + 4, cy - 2, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawPrincess(ctx, x, y) {
      ctx.fillStyle = 'rgba(255,220,220,.9)';
      ctx.beginPath(); ctx.moveTo(x, y + 10); ctx.lineTo(x - 14, y + 34); ctx.lineTo(x + 14, y + 34); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#F6D9B8'; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5A3B2E'; ctx.beginPath(); ctx.arc(x, y - 2, 10, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#E8C64A';
      ctx.beginPath();
      ctx.moveTo(x - 7, y - 10); ctx.lineTo(x - 4, y - 18); ctx.lineTo(x, y - 11);
      ctx.lineTo(x + 4, y - 18); ctx.lineTo(x + 7, y - 10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,220,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 12, y + 8); ctx.lineTo(x + 26, y - 4); ctx.stroke();
    }

    document.addEventListener('keydown', (e) => {
      if (state.scene !== 'parkour' || !parkour.running || e.repeat) return;
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); parkourJump(); }
    });
    document.addEventListener('keyup', (e) => {
      if (state.scene !== 'parkour') return;
      if (e.code === 'Space' || e.code === 'ArrowUp') parkourRelease();
    });

    const mountainPanel = $('#mountain-panel');

    function renderMountain() {
      if (!mountainPanel || mountainPanel.dataset.ready === '1') return;
      mountainPanel.dataset.ready = '1';
      mountainPanel.innerHTML = `
        <div class="mountain-bg" style="background-image:linear-gradient(rgba(16,26,36,.42),rgba(244,236,221,.9)),url('${assets.photos.p06}')"></div>
        <div class="mountain-content">

          <div class="mountain-sheet">

            <p class="wish-steps">① 写一句愿望　② 点「系上」</p>

              </svg>
            </div>
            <p class="done-line hidden" data-testid="mountain-done">${CONTENT.COPY.mountain.done}</p>
            <button class="btn btn-primary hidden" data-testid="to-cake">${CONTENT.COPY.mountain.next}</button>
          </div>
        </div>`;
      $('[data-testid="wish-submit"]', mountainPanel).addEventListener('click', submitWish);
      $('[data-testid="to-cake"]', mountainPanel).addEventListener('click', () => setScene('cake'));
      restoreMountain();
      setStoryStatus(state.wish ? '红丝带已经系上树梢。他还在等山风。' : '山风穿过树梢，满树的红丝带都在响。', mountainPanel);
    }

    function submitWish() {
      const input = $('[data-testid="wish-input"]', mountainPanel);
      const hint = $('[data-testid="wish-hint"]', mountainPanel);
      const box = $('[data-testid="wish-box"]', mountainPanel);
      // 空着就系上会让人以为没反应；先提醒一句，别真的跳过这一步
      if (!input.value.trim() && !state.wish) {
        hint.textContent = CONTENT.COPY.mountain.empty;
        hint.classList.add('warn');
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        input.focus();
        chime(340);
        return;
      }
      setState(CORE.recordWish(state, input.value));
      input.value = state.wish;
      $('.ribbon-text', mountainPanel).textContent = state.wish;
      $('.ribbon-wrap', mountainPanel).classList.add('fly');
      setStoryStatus('红丝带飞上树梢。', mountainPanel);
      hint.textContent = '';
      hint.classList.remove('warn');
      chime(640);
      // 先看丝带飞，再给"山听见了"和去蛋糕店的按钮——两拍，别一起砸出来
      setTimeout(() => {
        $('[data-testid="mountain-done"]', mountainPanel).classList.remove('hidden');
        $('[data-testid="to-cake"]', mountainPanel).classList.remove('hidden');
        setStoryStatus('山风把丝带吹得直响。', mountainPanel);
        scrollToNext(mountainPanel);
      }, 900);
    }

    function restoreMountain() {
      if (!state.wish) return;
      const wrap = $('.ribbon-wrap', mountainPanel);
      wrap.classList.add('fly');
      $('[data-testid="mountain-done"]', mountainPanel).classList.remove('hidden');
      $('[data-testid="to-cake"]', mountainPanel).classList.remove('hidden');
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(text) { return escapeHtml(text); }

    const cakePanel = $('#cake-panel');

    function renderCake() {
      if (!cakePanel || cakePanel.dataset.ready === '1') return;
      cakePanel.dataset.ready = '1';
      cakePanel.innerHTML = `
        ${storyBanner('cake')}
        <h2 class="scene-title">蛋糕店 · 记得</h2>
        <p class="scene-sub">${CONTENT.COPY.cake.intro}</p>
        <p class="story-status" data-testid="story-status"></p>
        <div class="cake-shop">
          <p class="cake-question" data-testid="cake-question">${state.allergySolved ? CONTENT.COPY.cake.qCake : CONTENT.COPY.cake.qAllergy}</p>
          <div class="cake-options ${state.allergySolved ? 'hidden' : ''}" data-testid="allergen-options">
            ${CONTENT.ALLERGENS.map((a) => `<button class="cake-choice" data-testid="allergen-${a.id}" data-allergen="${a.id}">${a.label}</button>`).join('')}
          </div>
          <div class="cake-row ${state.allergySolved ? '' : 'hidden'}" data-testid="cake-row">
            ${CONTENT.CAKES.map((c) => `
              <button class="cake-card ${c.allergen ? 'allergen' : ''}" data-testid="cake-${c.id}" data-cake="${c.id}">
                <span class="cake-slice"></span>
                <span class="cake-name">${c.label}</span>
                ${c.allergen ? '<span class="cake-warn" aria-hidden="true">×</span>' : ''}
              </button>`).join('')}
          </div>
          <p class="cake-feedback" data-testid="cake-feedback" aria-live="polite"></p>
          <div class="cake-done ${state.cakeChosen ? '' : 'hidden'}" data-testid="cake-done">
            <p class="cake-line" data-testid="cake-line">${CONTENT.COPY.cake.line}</p>
            <div class="cake-memory" data-testid="cake-memory">
              <p class="cake-memory-label">${escapeHtml(CONTENT.COPY.cake.memoryLabel)}</p>
              ${CONTENT.COPY.cake.memoryLines.map((l) => `<p>${escapeHtml(l)}</p>`).join('')}
            </div>
            <p class="cake-teaser" data-testid="cake-teaser">${escapeHtml(CONTENT.COPY.cake.teaser)}</p>
            <p class="cake-carry" data-testid="cake-carry">${escapeHtml(CONTENT.COPY.cake.carry)}</p>
            <button class="btn btn-primary" data-testid="cake-next">${CONTENT.COPY.cake.next}</button>
          </div>
        </div>`;
      cakePanel.onclick = onCakeClick;
      syncCake();
      if (state.cakeChosen) setStoryStatus('他选了榴莲千层，抱在怀里。', cakePanel);
      else if (state.allergySolved) setStoryStatus('他记得：芒果不行。', cakePanel);
      else setStoryStatus('他站在柜台前，手心有点出汗。', cakePanel);
    }

    function onCakeClick(e) {
      const allergenBtn = e.target.closest('[data-allergen]');
      if (allergenBtn && !state.allergySolved) {
        if (allergenBtn.dataset.allergen === 'mango') {
          setState(CORE.recordAllergy(state));
          $('[data-testid="cake-feedback"]', cakePanel).textContent = CONTENT.COPY.cake.okAllergy;
          setStoryStatus('他记得：芒果不行。', cakePanel);
          chime(660);
          syncCake();
        } else {
          $('[data-testid="cake-feedback"]', cakePanel).textContent = CONTENT.COPY.cake.wrongAllergy;
          chime(320);
        }
        return;
      }
      const cakeBtn = e.target.closest('[data-cake]');
      if (cakeBtn && state.allergySolved && !state.cakeChosen) {
        if (cakeBtn.dataset.cake === 'durian') {
          setState(CORE.recordCake(state, 'durian', CONTENT.CAKES.map((c) => c.id)));
          $('[data-testid="cake-feedback"]', cakePanel).textContent = CONTENT.COPY.cake.okCake;
          setStoryStatus('他选了榴莲千层，抱在怀里。', cakePanel);
          chime(700);
          syncCake();
          scrollToNext(cakePanel);
        } else {
          $('[data-testid="cake-feedback"]', cakePanel).textContent = cakeBtn.dataset.cake === 'mango'
            ? '芒果不行。他记得你碰它会过敏。'
            : CONTENT.COPY.cake.wrongCake;
          chime(320);
        }
      }
    }

    function syncCake() {
      const q = $('[data-testid="cake-question"]', cakePanel);
      const options = $('[data-testid="allergen-options"]', cakePanel);
      const row = $('[data-testid="cake-row"]', cakePanel);
      const done = $('[data-testid="cake-done"]', cakePanel);
      if (state.allergySolved) {
        q.textContent = CONTENT.COPY.cake.qCake;
        options.classList.add('hidden');
        row.classList.remove('hidden');
      } else {
        q.textContent = CONTENT.COPY.cake.qAllergy;
        options.classList.remove('hidden');
        row.classList.add('hidden');
      }
      done.classList.toggle('hidden', !state.cakeChosen);
      if (state.cakeChosen) {
        q.classList.add('hidden');
        row.classList.add('hidden');
        $('[data-testid="cake-feedback"]', cakePanel).classList.add('hidden');
        const next = $('[data-testid="cake-next"]', cakePanel);
        if (!next.dataset.bound) {
          next.dataset.bound = '1';
          next.addEventListener('click', () => setScene('letter'));
        }
      }
    }

    const letterPanel = $('#letter-panel');

    function renderLetter() {
      if (!letterPanel || letterPanel.dataset.ready === '1') return;
      letterPanel.dataset.ready = '1';
      letterPanel.innerHTML = `
        ${storyBanner('letter')}
        <p class="story-status" data-testid="story-status">雾收走的东西，都在这一页上了。</p>
        <div class="letter-paper">
          <p class="letter-to">致米宝</p>
          <div data-testid="letter-sections">
            ${CONTENT.LETTER.map((sec, i) => `
              <section class="letter-section ${i < state.letterRevealed ? 'show' : ''}" data-letter="${i}" data-testid="letter-section-${i}">
                <h3>【${sec.key}】</h3>
                <p class="letter-note">${CONTENT.COPY.memoryNotes[i]}</p>
                ${sec.paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join('')}
              </section>`).join('')}
          </div>
          <div class="letter-signature ${state.letterRevealed >= 3 ? 'show' : ''}" data-testid="letter-signature">
            <p>${CONTENT.SIGNATURE[0]}</p><p>${CONTENT.SIGNATURE[1]}</p>
          </div>
          <div class="next-row">
            <button class="btn btn-fire" data-testid="letter-next">${state.letterRevealed === 0 ? CONTENT.COPY.letter.open : CONTENT.COPY.letter.next}</button>
            <button class="btn" data-testid="letter-all">${CONTENT.COPY.letter.all}</button>
            <button class="btn btn-primary hidden" data-testid="letter-close">${CONTENT.COPY.letter.close}</button>
          </div>
        </div>`;
      bindLetter();
      syncLetter();
    }

    function bindLetter() {
      $('[data-testid="letter-next"]', letterPanel).addEventListener('click', () => {
        setState(CORE.revealLetter(state, CONTENT.LETTER.length));
        syncLetter();
        chime(600);
      });
      $('[data-testid="letter-all"]', letterPanel).addEventListener('click', () => {
        const s = CORE.clone(state);
        s.letterRevealed = CONTENT.LETTER.length;
        setState(s);
        syncLetter();
      });
      $('[data-testid="letter-close"]', letterPanel).addEventListener('click', () => setScene('finale'));
    }

    function syncLetter() {
      $$('.letter-section', letterPanel).forEach((sec, i) => sec.classList.toggle('show', i < state.letterRevealed));
      const sig = $('[data-testid="letter-signature"]', letterPanel);
      sig.classList.toggle('show', state.letterRevealed >= 3);
      const open = $('[data-testid="letter-next"]', letterPanel);
      open.textContent = state.letterRevealed === 0 ? CONTENT.COPY.letter.open : CONTENT.COPY.letter.next;
      open.classList.toggle('hidden', state.letterRevealed >= 3);
      $('[data-testid="letter-all"]', letterPanel).classList.toggle('hidden', state.letterRevealed >= 3);
      $('[data-testid="letter-close"]', letterPanel).classList.toggle('hidden', state.letterRevealed < 3);
    }

    const finalePanel = $('#finale-panel');
    let candleTimer = null;

    function renderFinale() {
      if (!finalePanel || finalePanel.dataset.ready === '1') return;
      finalePanel.dataset.ready = '1';
      const heart = photoById('p17');
      finalePanel.innerHTML = `
        ${storyBanner('finale')}
        <p class="story-status" data-testid="story-status">蜡烛还亮着。就等你了。</p>
        <div class="finale-head">
          <p class="wish-echo ${state.wish ? '' : 'hidden'}" data-testid="wish-echo">${escapeHtml(state.wish)}</p>
          <h2 class="scene-title">把我们的光，留在这里</h2>
        </div>
        <div class="gallery" data-testid="gallery">
          ${CONTENT.PHOTOS.filter((p) => p.wall !== false).map((p) => `
            <button class="gallery-item" data-testid="photo-${p.id}" data-photo="${p.id}">
              <img src="${assets.photos[p.id]}" alt="${p.caption}" loading="lazy">
              <span>${p.caption}</span>
            </button>`).join('')}
        </div>
        <div class="cake-zone">
          <button class="cake" data-testid="candle" aria-label="长按吹灭蜡烛">
            <span class="cake-plate"></span>
            <span class="cake-body"></span>
            <span class="candle-stick"><span class="candle-flame"></span></span>
          </button>
          <p class="candle-hint" data-testid="candle-hint">${CONTENT.COPY.finale.candleHint}</p>
          <figure class="heart-photo hidden" data-testid="heart-photo" data-reveal="0">
            <img src="${assets.photos[heart.id]}" alt="${heart.caption}">
            <figcaption>${heart.caption}</figcaption>
          </figure>
          <div class="finale-big hidden" data-testid="finale-big">
            <p class="big-line">${CONTENT.COPY.finale.big}</p>
            <p class="small-line">${CONTENT.COPY.finale.small}</p>
            <p class="gift-line" data-testid="gift-line">${CONTENT.COPY.finale.gift}</p>
            <div class="next-row">
              <button class="btn" data-testid="reread">${CONTENT.COPY.finale.reread}</button>
              <button class="btn" data-testid="restart">${CONTENT.COPY.finale.restart}</button>
            </div>
          </div>
        </div>
        <div class="lightbox hidden" data-testid="lightbox" role="dialog" aria-modal="true" aria-label="查看照片">
          <button class="lightbox-close" data-testid="lightbox-close" aria-label="关闭">×</button>
          <img data-testid="lightbox-img" alt="">
        </div>`;
      bindFinale();
      if (state.completed) {
        markCandleOut();
        revealHeart(false);
      }
    }

    function bindFinale() {
      $('[data-testid="gallery"]', finalePanel).addEventListener('click', (e) => {
        const item = e.target.closest('.gallery-item');
        if (!item) return;
        const lightbox = $('[data-testid="lightbox"]', finalePanel);
        $('[data-testid="lightbox-img"]', finalePanel).src = assets.photos[item.dataset.photo];
        $('[data-testid="lightbox-img"]', finalePanel).alt = photoById(item.dataset.photo).caption;
        lightbox.classList.remove('hidden');
      });
      $('[data-testid="lightbox-close"]', finalePanel).addEventListener('click', closeLightbox);
      $('[data-testid="lightbox"]', finalePanel).addEventListener('click', (e) => { if (e.target === e.currentTarget) closeLightbox(); });
      if (!window.__muhooEscBound) {
        window.__muhooEscBound = true;
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
      }

      const candle = $('[data-testid="candle"]', finalePanel);
      const start = () => {
        if (state.completed || candleTimer) return;
        candle.classList.add('blowing');
        candleTimer = setTimeout(() => { candleTimer = null; blowCandle(); }, 1000);
      };
      const end = () => { if (candleTimer) { clearTimeout(candleTimer); candleTimer = null; candle.classList.remove('blowing'); } };
      candle.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
      candle.addEventListener('pointerup', end);
      candle.addEventListener('pointerleave', end);
      candle.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); } });
      candle.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); end(); } });

      $('[data-testid="reread"]', finalePanel).addEventListener('click', () => setScene('letter'));
      $('[data-testid="restart"]', finalePanel).addEventListener('click', () => {
        try { localStorage.removeItem(KEY); } catch {}
        location.reload();
      });
    }

    function closeLightbox() {
      const lb = $('[data-testid="lightbox"]', finalePanel);
      if (lb) lb.classList.add('hidden');
    }

    function markCandleOut() {
      finalePanel.classList.add('candle-out');
      const label = $('.story-label', finalePanel);
      if (label) label.textContent = '尾声 · 灯灭了';
      const body = $('.story-text', finalePanel);
      if (body) body.textContent = '灯灭了。她就在那里。';
      setStoryStatus('蜡烛灭了。蛋糕还热着。', finalePanel);
    }

    function blowCandle() {
      setState(CORE.markComplete(state));
      markCandleOut();
      chime(420);
      revealHeart(true);
      // 照片一出现就把视线带过去：照片顶到离顶部 76px，下面三行字正好也在屏内
      scrollToEl($('[data-testid="heart-photo"]', finalePanel), 700);
    }

    function revealHeart(animate) {
      const heart = $('[data-testid="heart-photo"]', finalePanel);
      const big = $('[data-testid="finale-big"]', finalePanel);
      heart.classList.remove('hidden');
      heart.dataset.reveal = '1';
      setTimeout(() => {
        big.classList.remove('hidden');
        $('[data-testid="candle-hint"]', finalePanel).classList.add('hidden');
        // 三行字出现后页才够长，这时再对一次位置：照片顶到 76px，字也能一起进屏
        if (animate) scrollToEl(heart, 0);
      }, animate ? 3000 : 0);
    }

    let startArmed = false;
    let startArmTimer = null;
    bindCover();
    makeFireflies();
    $('[data-testid="start"]').addEventListener('click', () => {
      const startBtn = $('[data-testid="start"]');
      // 有存档时先要一次确认（自定义的二次点击，不用系统弹窗）
      if (hadSave && !startArmed) {
        startArmed = true;
        startBtn.textContent = CONTENT.COPY.cover.startConfirm;
        startBtn.classList.add('btn-fire');
        startArmTimer = setTimeout(() => {
          startArmed = false;
          startArmTimer = null;
          startBtn.textContent = CONTENT.COPY.cover.start;
          startBtn.classList.remove('btn-fire');
        }, 4000);
        return;
      }
      if (startArmTimer) { clearTimeout(startArmTimer); startArmTimer = null; }
      startArmed = false;
      hadSave = false;
      startBtn.textContent = CONTENT.COPY.cover.start;
      startBtn.classList.remove('btn-fire');
      // 重开时保留音乐开关，避免按钮说「开」而背景音乐已经停了
      const keepAudio = state.audioOn;
      state = CORE.createState();
      state.audioOn = keepAudio;
      save();
      resetPanels();
      setScene('wood');
    });
    $('[data-testid="resume"]').addEventListener('click', () => {
      // 已看完尾声时按钮写的是「再看一遍 · 尾声」，就真的把她送到尾声
      setScene(state.completed ? 'finale' : state.scene);
    });
    $('[data-testid="back"]').addEventListener('click', () => {
      const idx = CORE.SCENES.indexOf(state.scene);
      if (idx > 1) setScene(CORE.SCENES[idx - 1]);
    });
    $('[data-testid="replay"]').addEventListener('click', replayLevel);
    $('[data-testid="audio-toggle"]').addEventListener('click', toggleAudio);
    // 木幕的"往下滑"提示跟着滚动重新判断：滑下去自然收起，滚回上面又会露出来
    window.addEventListener('scroll', updateWoodMore, { passive: true });
    window.addEventListener('resize', updateWoodMore);
    document.addEventListener('visibilitychange', () => {
      if (!bgAudio) return;
      if (document.hidden && state.audioOn) bgAudio.pause();
      if (!document.hidden && state.audioOn) bgAudio.play().catch(() => {});
    });

    // 调试接口只在地址栏带 #debug 时挂出；直接双击打开成品时不存在，
    // 免得她误按 F12 或改存档把眼睛提前看光。
    if (location.hash.indexOf('debug') !== -1) {
      window.__MUHUO__ = {
        getState: () => CORE.clone(state),
        setState: (next) => { const keep = state.audioOn; state = next; state.audioOn = keep; save(); sync(); },
        goTo: (scene) => setScene(scene),
        parkourRescue: () => triggerRescue(),
        parkourWin: () => finishParkour(true)
      };
    }
    sync();
  })();
  </script>
</body>
</html>
